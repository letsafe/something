
name: 2021 Studio Source Transfer

on:
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository containing the release
        required: true
        type: string
        default: letsafe/something

      ref:
        description: Release tag
        required: true
        type: string
        default: v1.0.0

      asset:
        description: Exact release asset filename
        required: true
        type: string
        default: thing.zip

permissions:
  contents: read

jobs:
  transfer:
    name: Download 2021 Studio release asset
    runs-on: ubuntu-latest

    steps:
      - name: Download release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          ASSET: ${{ inputs.asset }}
        run: |
          set -euo pipefail

          mkdir -p download transfer

          gh release download "$REF" \
            --repo "$REPOSITORY" \
            --pattern "$ASSET" \
            --dir download

          if [[ ! -f "download/$ASSET" ]]; then
            echo "::error::Release asset not found: $ASSET"
            exit 1
          fi

          cp "download/$ASSET" "transfer/$ASSET"
          sha256sum "transfer/$ASSET" > transfer/SHA256SUMS.txt

          echo "Downloaded asset:"
          ls -lh "transfer/$ASSET"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2021-studio-source
          path: transfer/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
