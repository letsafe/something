
name: Source File Byte Transfer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to transfer
        required: true
        type: choice
        options:
          - source
          - yeku-v27
        default: yeku-v27
      repository:
        description: Repository to clone in source mode
        required: true
        type: string
        default: telegramdesktop/tdesktop
      ref:
        description: Branch, tag, or commit SHA
        required: true
        type: string
        default: dev
      paths:
        description: Paths to retrieve in source mode, one per line
        required: true
        type: string
        default: .

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install ZIP utility
        if: inputs.mode == 'source'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip

      - name: Download Yeku V27 release asset
        if: inputs.mode == 'yeku-v27'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer

          curl -fL --retry 3 \
            "https://github.com/letsafe/something/releases/download/v1.0.0/knifethingy6_complete_2015-20202_FIXED_v27.rbxmx" \
            -o transfer/knifethingy6_complete_2015-20202_FIXED_v27.rbxmx

          echo "Downloaded file:"
          stat -c '%n — %s bytes' transfer/*.rbxmx

          echo "SHA256:"
          sha256sum transfer/*.rbxmx

      - name: Clone source repository
        if: inputs.mode == 'source'
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          mkdir source
          git -C source init
          git -C source remote add origin \
            "https://github.com/${INPUT_REPOSITORY}.git"
          git -C source fetch --depth 1 origin "$INPUT_REF"
          git -C source checkout --detach FETCH_HEAD
          git -C source submodule update --init --recursive --depth 1

      - name: Package source files
        if: inputs.mode == 'source'
        shell: bash
        env:
          INPUT_PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          mkdir -p transfer
          cd source

          mapfile -t paths <<< "$INPUT_PATHS"
          selected=()

          for path in "${paths[@]}"; do
            path="$(echo "$path" | xargs)"
            [[ -z "$path" ]] && continue

            if [[ "$path" == /* || "$path" =~ (^|/)\.\.(/|$) ]]; then
              echo "::error::Unsafe path: $path"
              exit 1
            fi

            [[ -e "$path" ]] || {
              echo "::error::Path does not exist: $path"
              exit 1
            }

            selected+=("$path")
          done

          [[ ${#selected[@]} -gt 0 ]] || exit 1

          zip -qr "$GITHUB_WORKSPACE/transfer/source-bytes.zip" \
            "${selected[@]}" \
            -x '*/.git/*' '*/.git' '.git/*' '.git'

      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeku-v27-binary
          path: transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
