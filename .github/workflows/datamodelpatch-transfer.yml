name: Temporary Release Asset Transfer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/datamodelpatch-transfer.yml
  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository in owner/name format
        required: true
        type: string
        default: letsafe/something
      release_tag:
        description: Release tag to download from
        required: true
        type: string
        default: v1.0.0
      asset_names:
        description: Exact release asset names, comma-separated
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    name: Download and package selected release assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download selected release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: ${{ github.event.inputs.repository }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          INPUT_ASSET_NAMES: ${{ github.event.inputs.asset_names }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          repository="${INPUT_REPOSITORY:-letsafe/something}"
          release_tag="${INPUT_RELEASE_TAG:-v1.0.0}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_names="$INPUT_ASSET_NAMES"
          else
            requested_names="DataModelPatch_decompiled.rbxmx"
          fi

          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid repository. Use owner/name."
            exit 1
          fi

          if [[ -z "$release_tag" ]]; then
            echo "::error::Release tag cannot be empty."
            exit 1
          fi

          if [[ -z "${requested_names//[[:space:],]/}" ]]; then
            echo "::error::Enter at least one exact release asset name."
            exit 1
          fi

          encoded_tag="$(jq -rn --arg value "$release_tag" '$value | @uri')"
          release_api="https://api.github.com/repos/${repository}/releases/tags/${encoded_tag}"

          echo "Repository: $repository"
          echo "Release tag: $release_tag"

          release_json="$(curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$release_api")"

          asset_count="$(jq '.assets | length' <<< "$release_json")"
          if [[ "$asset_count" -eq 0 ]]; then
            echo "::error::The selected release has no downloadable assets."
            exit 1
          fi

          mkdir -p release-assets
          downloaded_count=0

          download_one() {
            local asset_name="$1"
            local asset_json="$2"
            local download_url output_path size_bytes sha256 expected_digest

            if [[ "$asset_name" == "." || "$asset_name" == ".." || "$asset_name" == */* || "$asset_name" == *\\* ]]; then
              echo "::error::Invalid asset filename: $asset_name"
              exit 1
            fi

            download_url="$(jq -r '.browser_download_url // empty' <<< "$asset_json")"
            expected_digest="$(jq -r '.digest // empty' <<< "$asset_json")"

            if [[ "$download_url" != https://github.com/* ]]; then
              echo "::error::GitHub returned an unexpected download URL for $asset_name"
              exit 1
            fi

            output_path="release-assets/$asset_name"

            echo "Downloading: $asset_name"

            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 \
              "$download_url" --output "$output_path"

            if [[ ! -s "$output_path" ]]; then
              echo "::error::Downloaded file is empty: $asset_name"
              exit 1
            fi

            size_bytes="$(stat --format='%s' "$output_path")"
            sha256="$(sha256sum "$output_path" | awk '{print $1}')"

            if [[ "$expected_digest" == sha256:* ]]; then
              if [[ "$sha256" != "${expected_digest#sha256:}" ]]; then
                echo "::error::SHA-256 mismatch for $asset_name"
                exit 1
              fi
              echo "GitHub SHA-256 digest verified."
            fi

            printf 'Downloaded size: %s bytes\nSHA-256: %s\n' "$size_bytes" "$sha256"
            printf '| `%s` | %s bytes | `%s` |\n' "$asset_name" "$size_bytes" "$sha256" >> "$GITHUB_STEP_SUMMARY"

            downloaded_count=$((downloaded_count + 1))
          }

          echo '## Transferred release assets' >> "$GITHUB_STEP_SUMMARY"
          echo '| File | Size | SHA-256 |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---|' >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r asset_name; do
            asset_name="$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' <<< "$asset_name")"
            [[ -z "$asset_name" ]] && continue

            if ! asset_json="$(jq -ce --arg name "$asset_name" \
              '[.assets[] | select(.name == $name)] | select(length == 1) | .[0]' \
              <<< "$release_json")"; then
              echo "::error::Exact asset name not found in ${repository}@${release_tag}: $asset_name"
              echo "Available asset names:"
              jq -r '.assets[].name' <<< "$release_json"
              exit 1
            fi

            download_one "$asset_name" "$asset_json"

          done < <(printf '%s' "$requested_names" | tr ',' '\n')

          if [[ "$downloaded_count" -eq 0 ]]; then
            echo "::error::No release assets were selected."
            exit 1
          fi

          echo "Successfully downloaded $downloaded_count release asset(s)."
          find release-assets -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort

      - name: Upload short-lived transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-transfer-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
