
name: Source File Byte Transfer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/datamodelpatch-transfer.yml

  workflow_dispatch:
    inputs:
      repository:
        description: GitHub repository (owner/name)
        required: true
        type: string
        default: telegramdesktop/tdesktop

      ref:
        description: Branch, tag, or commit SHA
        required: true
        type: string
        default: dev

      paths:
        description: |
          Paths to retrieve, one per line.
          Use . for the entire repository.
        required: true
        type: string
        default: .

permissions:
  contents: read

jobs:
  transfer:
    name: Retrieve source bytes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate request and install ZIP utility
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zip

      - name: Clone repository with ALL submodules
        shell: bash
        env:
          INPUT_REPOSITORY: ${{ github.event.inputs.repository }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_PATHS: ${{ github.event.inputs.paths }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          repository="${INPUT_REPOSITORY:-telegramdesktop/tdesktop}"
          ref="${INPUT_REF:-dev}"
          requested_paths="${INPUT_PATHS:-.}"

          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid repository name."
            exit 1
          fi

          if [[ -z "$ref" || -z "$requested_paths" ]]; then
            echo "::error::Ref and paths cannot be empty."
            exit 1
          fi

          echo "Repository: $repository"
          echo "Ref: $ref"

          mkdir source
          git -C source init
          git -C source remote add origin \
            "https://github.com/${repository}.git"

          git -C source fetch --depth 1 origin "$ref"
          git -C source checkout --detach FETCH_HEAD

          echo "Initializing recursive submodules..."

          git -C source submodule update \
            --init --recursive --depth 1

          echo "Submodules initialized:"
          git -C source submodule status --recursive

          echo "## Source retrieval" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: \`$repository\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submodules: initialized recursively" >> "$GITHUB_STEP_SUMMARY"

      - name: Package requested files
        shell: bash
        env:
          INPUT_PATHS: ${{ github.event.inputs.paths }}
        run: |
          set -euo pipefail

          requested_paths="${INPUT_PATHS:-.}"
          mkdir -p transfer

          cd source

          mapfile -t paths <<< "$requested_paths"
          selected=()

          for path in "${paths[@]}"; do
            path="$(echo "$path" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            [[ -z "$path" ]] && continue

            if [[ "$path" == /* || "$path" =~ (^|/)\.\.(/|$) ]]; then
              echo "::error::Unsafe path: $path"
              exit 1
            fi

            if [[ ! -e "$path" ]]; then
              echo "::error::Path does not exist: $path"
              exit 1
            fi

            selected+=("$path")
            echo "- \`$path\`" >> "$GITHUB_STEP_SUMMARY"
          done

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "::error::No valid paths selected."
            exit 1
          fi

          zip -qr "$GITHUB_WORKSPACE/transfer/source-bytes.zip" \
            "${selected[@]}" \
            -x '*/.git/*' '*/.git' '.git/*' '.git'

          cd "$GITHUB_WORKSPACE"

          echo "## Archive information" >> "$GITHUB_STEP_SUMMARY"
          sha256sum transfer/source-bytes.zip \
            | tee transfer/SHA256.txt

          stat -c 'Archive size: %s bytes' \
            transfer/source-bytes.zip

      - name: Upload source byte artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-bytes-${{ github.run_id }}
          path: transfer/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
