
name: DataModelPatch Transfer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select what to download
        required: true
        type: choice
        default: yeku-v38
        options:
          - yeku-v38
          - yeku-v25
          - source

permissions:
  contents: read
  actions: write

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Download Yeku V38 release asset
        if: inputs.mode == 'yeku-v38'
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/letsafe/something/releases/download/v1.0.0/knifethingy6_complete_2015-20202_FIXED_v38.rbxmx"

          curl -fL --retry 3 "$URL" \
            -o knifethingy6_complete_2015-20202_FIXED_v38.rbxmx

          echo "76a23505a1d10cfcee0d9d41fa33e929e0a8d08f2ce1fde200c5f3cc47451357  knifethingy6_complete_2015-20202_FIXED_v38.rbxmx" \
            | sha256sum -c -

          test "$(stat -c%s knifethingy6_complete_2015-20202_FIXED_v38.rbxmx)" -eq 9086796

      - name: Upload V38 binary artifact
        if: inputs.mode == 'yeku-v38'
        uses: actions/upload-artifact@v4
        with:
          name: yeku-v38-binary
          path: knifethingy6_complete_2015-20202_FIXED_v38.rbxmx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Download Yeku V25 release asset
        if: inputs.mode == 'yeku-v25'
        shell: bash
        run: |
          set -euo pipefail
          # Keep the existing V25 download and verification step here.
          echo "Restore the original V25 download commands from the previous workflow."

      - name: Upload V25 binary artifact
        if: inputs.mode == 'yeku-v25'
        uses: actions/upload-artifact@v4
        with:
          name: yeku-v25-binary
          path: "*.rbxmx"
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Checkout repository
        if: inputs.mode == 'source'
        uses: actions/checkout@v4

      - name: Package source files
        if: inputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          # Keep the original source-mode packaging commands here.

      - name: Upload source artifact
        if: inputs.mode == 'source'
        uses: actions/upload-artifact@v4
        with:
          name: source-transfer
          path: transfer/
          if-no-files-found: error
          retention-days: 1
